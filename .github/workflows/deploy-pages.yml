name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Checked hourly because GitHub drops / delays scheduled runs; the gate job
    # below only rebuilds once the live data is more than 3.5 hours old, so the
    # dashboard refreshes about every 4 hours even when some runs are skipped.
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.age.outputs.go }}
    steps:
      - id: age
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          ts=$(curl -fsS "https://deniskims11.github.io/bloom-bond-dashboard/data/latest.json?t=$(date +%s)" \
            | python3 -c "import json,sys,datetime;print(int(datetime.datetime.fromisoformat(json.load(sys.stdin)['generated_at']).timestamp()))" || echo 0)
          age=$(( $(date +%s) - ${ts:-0} ))
          echo "live data age: $((age / 60)) min"
          if [ "$age" -gt 12600 ]; then echo "go=true"; else echo "go=false"; fi >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch data from Triple Whale
        env:
          TW_API_KEY: ${{ secrets.TW_API_KEY }}
        run: python3 scripts/fetch_tw_sql.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub disables scheduled workflows after 60 days without repository
  # activity, and this repo never commits data. Touch a heartbeat file every
  # ~3 weeks so the 4-hourly refresh keeps running.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit heartbeat if stale
        run: |
          f=.github/heartbeat
          last=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)
          last=${last:-0}
          if [ $(( $(date +%s) - last )) -gt $(( 21 * 86400 )) ]; then
            date -u +%Y-%m-%dT%H:%MZ > "$f"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$f" && git commit -m "chore: keep scheduled refresh alive" && git push
          else
            echo "heartbeat fresh"
          fi
